name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    uses: caerus-framework/caerus-framework/.github/workflows/go-module-ci.yml@main
    with:
      module: caerus-framework-demoapp
      deps: "caerus-framework caerus-framework-configuration caerus-framework-logs caerus-framework-observability caerus-framework-http caerus-framework-postgresql caerus-framework-valkey caerus-framework-valkey-queues"
      coverage: false
      caerusvet: true
